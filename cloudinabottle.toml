[app]
name = "reader"
version = "0.1.0"
description = "A keyboard-first feed reader in the spirit of Google Reader"

[runtime.container]
image = "Dockerfile"
port = 8080

# Measured peaks rather than guesses.
#
# Build: pnpm install ~604 MB, `tsc` for the server ~584 MB, and the Vite/Rollup
# bundle ~496 MB. build_memory_mb defaults to memory_mb, so leaving it unset
# capped the build at 256 MB and the OOM killer stopped the install (exit 137).
#
# Runtime: ~174 MB idle, ~185 MB after subscribing to a large feed, refreshing
# every feed and running a 200-item query. 512 MB leaves room for the six
# concurrent fetches a refresh can have in flight.
[resources]
memory_mb = 512
build_memory_mb = 2048
cpu_cores = 0.5

[data]
# SQLite lives under $BOTTLE_APP_DATA_DIR, which the server picks up automatically.
app_data = true

[routing]
health_check = "/api/health"
public_paths = ["/mcp"]
# No public paths on purpose. The reader, including /mcp, stays behind the
# platform's authentication — which an MCP client satisfies with a token from
# `bottle tokens create`, so nothing here needs to be opened up. MCP_AUTH=router
# in the Dockerfile depends on this; the server checks it at startup and refuses
# that mode if /mcp is ever listed below.

[[services.v2.consumes]]
service = "github.com/imbue-openhost/openhost/services/secrets"
shortname = "secrets"
version = ">=0.1.0"
grants = [{key = "READER_MCP_TOKEN"}]
public_paths = ["/mcp"]
